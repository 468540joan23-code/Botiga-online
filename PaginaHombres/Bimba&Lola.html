<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bimba & Lola - Colección Hombre</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f8f8;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .precio {
            color: green;
            font-weight: bold;
        }

        button {
            background-color: black;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background-color: #333;
        }
        
    </style>
</head>
<body>
    <div class="container">

        <div class="card">
            <img src="./img/Maletín.png" alt="Maletín Ejecutivo de piel">
            <div class="card-content">
                <h3>Maletín Ejecutivo Piel</h3>
                <p class="precio">245 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/Mochila Tech.png" alt="Mochila Urbana Tech">
            <div class="card-content">
                <h3>Mochila Urbana Tech</h3>
                <p class="precio">185 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/Bandolera.png" Bandolera Messenger alt="Bandolera Messenger">
            <div class="card-content">
                <h3>Bandolera Messenger</h3>
                <p class="precio">125 €</p>
                <button>Comprar</button>
            </div>
        </div>
  
        <div class="card">
            <img src="./img/Bolso Weekender.png" alt="Bolso Weekender">
            <div class="card-content">
                <h3>Bolso Weekender</h3>
                <p class="precio">210 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/Riñonera Crossbody.png" alt="Riñonera Crossbody">
            <div class="card-content">
                <h3>Riñonera Crossbody</h3>
                <p class="precio">85 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/Tote Bag Minimalista.png" alt="Tote Bag Minimalista">
            <div class="card-content">
                <h3>Tote Bag Minimalista</h3>
                <p class="precio">110 €</p>
                <button>Comprar</button>
            </div>
        </div>
        
        <div class="card">
            <img src="./img/Portafolio Slim Piel.png" alt="Portafolio Slim Piel">
            <div class="card-content">
                <h3>Portafolio Slim Piel</h3>
                <p class="precio">195 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/Mochila Canvas Retro.png" alt="Canvas Retro">
            <div class="card-content">
                <h3>Mochila Canvas Retro</h3>
                <p class="precio">160 €</p>
                <button>Comprar</button>
            </div>
        </div>

    </div>
</body>
</html>
