        .container {

        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);

            transition: transform 0.2s;
        }

        .card img {

            height: 300px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .precio {
            color: green;
            font-weight: bold;
        }

        a {
            display: block;
            background-color: black;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
