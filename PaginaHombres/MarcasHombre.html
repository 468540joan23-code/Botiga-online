<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcas</title>
    <style>
        .menu2 {
            list-style-type: none;
            padding-bottom: 5px;
            padding-top: 5px;
            background-color: #494949;
            margin: 0;
            display: flex;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f8f8f8;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.2s;
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .card-content {
            padding: 15px;
        }

        .precio {
            color: green;
            font-weight: bold;
        }

        a {
            display: block;
            background-color: black;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        
    </style>
</head>
<header>
    <ul class="menu2">
      <li class="opciones2"><a href="./index.html">Página Principal</a></li>
      <li class="opciones2"><a href="#hombre">Hombre</a></li>
      <li class="opciones2"><a href="#mujer">Mujer</a></li>
      <li class="opciones2"><a href="#unisex">Unisex</a></li>
      <li class="opciones2"><a href="#contacto">Contacto</a></li>
    </ul>
  <img src="./media/banner_socios.png" alt="Imagen con el texto Marianel, Club Élite" id="foto_socios">
  </header>
<body>
    <div class="container">

        <div class="card">
            <img src="./img/LogoB&L.png" alt="Bolso 1">
            <div class="card-content">
                <a href="./Bimba&Lola.html">Bolsos Bimba & Lola</a>
            </div>
        </div>

        <div class="card">
            <img src="./img/LogoCH.png" alt="Bolso 2">
            <div class="card-content">
                <a href="./CarolinaHerrera.html">Bolsos Carolina Herrera</a>
            </div>
        </div>

        <div class="card">
            <img src="./img/LogoGuess.png" alt="Bolso 3">
            <div class="card-content">
                <a href="./Guess.html">Bolsos Guess</a>
            </div>
        </div>
  
        <div class="card">
            <img src="./img/LogoMK.png" alt="Bolso 4">
            <div class="card-content">
                <a href="./MichaelKors.html">Bolsos Michael Kors</a>
            </div>
        </div>

        <div class="card">
            <img src="./img/LogoZ&V.png" alt="Bolso 5">
            <div class="card-content">
                <a href="./Zadig&Voltaire.html">Bolsos Zadig & Voltaire</a>
            </div>
        </div>

    </div>

</body>
</html>
