<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Michael Kors - Colección Hombre</title>
    <style>
        body {
            font-family: 'Helvetica', Arial, sans-serif;
            margin: 0;
            background-color: #f9f9f9;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.2s ease-in-out;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .card-content {
            padding: 20px;
        }

        h3 {
            font-size: 0.95rem;
            color: #333;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .precio {
            color: #111;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        button {
            background-color: #000;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="card">
            <img src="./img/bolsosmichaelkorshombre1.png" alt="Bolso 1">
            <div class="card-content">
                <h3>Mochila Hudson Logo</h3>
                <p class="precio">325 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/bolsosmichaelkorshombre2.png" alt="Bolso 2">
            <div class="card-content">
                <h3>Maletín Greyson Piel</h3>
                <p class="precio">395 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/bolsosmichaelkorshombre3.png" alt="Bolso 3">
            <div class="card-content">
                <h3>Bandolera Cooper Logo</h3>
                <p class="precio">195 €</p>
                <button>Comprar</button>
            </div>
        </div>
  
        <div class="card">
            <img src="./img/bolsosmichaelkorshombre4.png" alt="Bolso 4">
            <div class="card-content">
                <h3>Bolso Semanal Hudson</h3>
                <p class="precio">450 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/bolsosmichaelkorshombre5.png" alt="Bolso 5">
            <div class="card-content">
                <h3>Riñonera Kent Sport</h3>
                <p class="precio">175 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/bolsosmichaelkorshombre6.png" alt="Bolso 6">
            <div class="card-content">
                <h3>Mochila Brooklyn Mesh</h3>
                <p class="precio">295 €</p>
                <button>Comprar</button>
            </div>
        </div>
        
        <div class="card">
            <img src="./img/bolsosmichaelkorshombre7.png" alt="Bolso 7">
            <div class="card-content">
                <h3>Maletín Slim Harrison</h3>
                <p class="precio">350 €</p>
                <button>Comprar</button>
            </div>
        </div>

        <div class="card">
            <img src="./img/bolsosmichaelkorshombre8.png" alt="Bolso 8">
            <div class="card-content">
                <h3>Neceser de Viaje Logo</h3>
                <p class="precio">125 €</p>
                <button>Comprar</button>
            </div>
        </div>

    </div>

</body>
</html>
